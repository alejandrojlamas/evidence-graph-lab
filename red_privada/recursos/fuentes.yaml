project:
  user_agent: "${RED_PRIVADA_USER_AGENT}"
  request_delay_seconds: 1.0
  # Modo seguro: habilita únicamente fuentes con autorización explícita.
  allow_robots_unavailable: false
  cache_dir: "data/cache"
  database_path: "data/state/red_privada.sqlite"
  output_dir: "data/output"

llm:
  provider: "dev"  # dev (local) | deepseek (externo) | auto (consulta el README)
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-pro"
  temperature: 0.1
  max_output_tokens: 5000
  max_chars_per_document: 18000
  thinking: "disabled"
  user_id: "red-privada-extractor"
  cache_extractions: true

resolver:
  similarity_threshold: 0.92
  aliases:
    "Claudia Sheinbaum Pardo":
      - "Claudia Sheinbaum"
      - "Presidenta Claudia Sheinbaum"
    "Andrés Manuel López Obrador":
      - "AMLO"
      - "López Obrador"
      - "Andrés Manuel López Obrador"
    "Petróleos Mexicanos":
      - "Pemex"
      - "PEMEX"
    "Ciudad de México":
      - "CDMX"
      - "CdMx"

graph:
  backend: "sqlite"  # sqlite | neo4j (exportación experimental)
  neo4j:
    uri: "${NEO4J_URI:-neo4j://localhost:7687}"
    user: "${NEO4J_USER:-neo4j}"
    password: "${NEO4J_PASSWORD}"
    database: "neo4j"

scoring:
  enabled: true
  null_model_samples: 100
  null_model_seed: 20260608
  null_model_alpha: 0.1
  temporal_window_days: 7
  independence_threshold: 0.45
  improbability_threshold: 0.55
  specificity_threshold: 0.45
  temporal_threshold: 0.4
  min_final_score: 0.5

signals:
  enabled: true
  small_note_top_n: 10
  morning_top_n: 10
  novelty_window_days: 21
  low_attention_threshold: 0.35
  structural_novelty_threshold: 0.25
  small_note_min_score: 0.45
  morning_lookback_days: 14
  min_non_official_mentions: 1
  official_side: "official_government"

