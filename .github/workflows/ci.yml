name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configurar uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar el proyecto
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Analizar estilo
        run: uv run --locked --extra dev python -m ruff check evidence_graph_lab red_privada tests

      - name: Comprobar formato
        run: uv run --locked --extra dev python -m ruff format --check evidence_graph_lab red_privada tests

      - name: Ejecutar pruebas
        run: uv run --locked --extra dev python -m pytest -q

      - name: Construir el paquete
        run: uv run --locked --extra dev python -m build

      - name: Probar el wheel instalado fuera del checkout
        shell: bash
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          smoke_dir="$RUNNER_TEMP/red-privada-wheel-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"

          "$GITHUB_WORKSPACE/.venv/bin/red-privada" --help > /dev/null
          "$GITHUB_WORKSPACE/.venv/bin/evidence-graph" --help > /dev/null
          "$GITHUB_WORKSPACE/.venv/bin/python" -m red_privada --help > /dev/null
          "$GITHUB_WORKSPACE/.venv/bin/python" -m evidence_graph_lab --help > /dev/null
          "$GITHUB_WORKSPACE/.venv/bin/red-privada" run > /dev/null
          "$GITHUB_WORKSPACE/.venv/bin/red-privada" init --destino config/fuentes.yaml > /dev/null

          test -f data/state/red_privada.sqlite
          test -f config/fuentes.yaml
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          from importlib.resources import files

          assert files("red_privada.recursos").joinpath("fuentes.yaml").is_file()
          PY
