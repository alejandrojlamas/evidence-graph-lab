sources:
  - name: "presidencia_mananera"
    kind: "gob_presidency"
    enabled: false
    side: "official_government"
    attention_weight: 1.0
    attention_note: "Fuente oficial primaria con alta atención institucional."
    archive_url: "https://www.gob.mx/presidencia/es/archivo/articulos?idiom=es&order=DESC&page={page}"
    title_include: "Versión estenográfica. Conferencia de prensa de la presidenta Claudia Sheinbaum Pardo"
    max_pages: 1
    limit: 2
    note: "Ejemplo deshabilitado; verifica términos y robots.txt antes de activarlo."

  - name: "milenio_gerardo_esquivel"
    kind: "sitemap_column"
    enabled: false
    side: "configured_column_a"
    attention_weight: 0.55
    attention_note: "Columna configurada; el operador decide su peso editorial."
    sitemap_url: "https://www.milenio.com/sitemap/articles/sitemap-articles-current.xml"
    url_include: "/opinion/gerardo-esquivel/"
    limit: 1
    note: "Ejemplo deshabilitado; la etiqueta editorial es configuración, no inferencia."

  - name: "milenio_trascendio"
    kind: "sitemap_column"
    enabled: false
    side: "configured_column_b"
    attention_weight: 0.50
    attention_note: "Columna breve tratada como atención relativa menor."
    sitemap_url: "https://www.milenio.com/sitemap/articles/sitemap-articles-current.xml"
    url_include: "/opinion/editoriales/trascendio-nacional/"
    limit: 1
    note: "Ejemplo deshabilitado; verifica términos y robots.txt antes de activarlo."

  - name: "aristegui_opinion_rss"
    kind: "rss_feed"
    enabled: false
    side: "configured_opinion_c"
    feed_url: "https://editorial.aristeguinoticias.com/category/opinion/feed/"
    fetch_article: false
    min_text_chars: 120
    limit: 2
    attention_weight: 0.45
    attention_note: "RSS público de opinión; usa la descripción para reducir recolección."
    note: "Ejemplo deshabilitado; revisa términos y robots.txt antes de activarlo."

  - name: "jornada_opinion_rss"
    kind: "rss_feed"
    enabled: false
    side: "configured_opinion_d"
    feed_url: "https://www.jornada.com.mx/rss/opinion.xml"
